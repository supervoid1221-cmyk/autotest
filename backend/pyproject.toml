
[project]
name = ""
version = ""
description = ""
authors = [
    {name = "dongfangtianyu", email = "7629022+dongfangtianyu@users.noreply.github.com"},
]
dependencies = [
    "django>=4.2.3",
    "jsonpath>=0.82",
    "pyyaml>=6.0.1",
    "pytest-yaml>=1.2.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "djangorestframework>=3.14.0",
    "markdown>=3.4.4",
    "django-filter>=23.2",
    "drf-spectacular[sidecar]>=0.26.4",
    "drf-standardized-errors>=0.12.5",
    "selenium>=4.11.2",
    "playwright>=1.48.0",
    "django-q2>=1.5.4",
    "croniter>=1.4.1",
    "django-cors-headers>=4.2.0",
]
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.isort]
profile = "black"

[tool.pdm.scripts]

check = { composite = [
    'black .',
    'isort .',
    'flake8 .',
    'pytest',
]}


init = { composite = [
    "makeM",
    "M", 
    "createadmin",
]}


makeM = 'python manage.py makemigrations'

M = 'python manage.py migrate'

R = 'python manage.py runserver' # --noreload

T = 'python manage.py test'

createadmin = '''python manage.py shell -c "from django.contrib.auth.models import User; User.objects.create_superuser('admin', 'admin@example.com', 'adminpass')"'''

[tool.pdm.dev-dependencies]
dev = [
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "pytest>=7.4.0",
    "pytest-django>=4.5.2",
    "pytest-coverage>=0.0",
]
