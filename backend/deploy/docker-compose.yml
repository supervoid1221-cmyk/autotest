services:
  backend:
    image: test-platform-backend:latest
    build:
      context: ./backend
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend.env
    volumes:
      # 挂载稳定的 /run 父目录。MySQL 单独重启会重建 mysqld 子目录，
      # 若直接挂载子目录，存量容器会继续指向旧 inode 并丢失新 Socket。
      - /run:/host/run:ro
      - ./data/logs:/app/logs
      - ./data/screenshots:/app/screenshots
      - ./data/temps:/app/temps
      - ./data/upload_yaml:/app/upload_yaml
      - ./data/uploaded_api_files:/app/uploaded_api_files
      - ./data/runtime_auth_locks:/app/runtime_auth_locks
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 30s

  scheduler:
    image: test-platform-backend:latest
    build:
      context: ./backend
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "qcluster"]
    env_file:
      - ./backend.env
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /run:/host/run:ro
      - ./data/logs:/app/logs
      - ./data/screenshots:/app/screenshots
      - ./data/temps:/app/temps
      - ./data/upload_yaml:/app/upload_yaml
      - ./data/uploaded_api_files:/app/uploaded_api_files
      - ./data/runtime_auth_locks:/app/runtime_auth_locks

  web:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./frontend-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
